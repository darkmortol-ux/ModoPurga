name: ModoPurga
version: 1.0.0
main: com.darkmortol.modopurga.ModoPurgaPlugin
api-version: '1.20'
authors: [DARKMORTOL]
description: Minijuego Purga (looting + PvP) con aislamiento de comandos
softdepend: [Multiverse-Core]

commands:
  purga:
    description: Comando principal de ModoPurga
    usage: /purga <salir|status|start|stop|reload>

permissions:
  modopurga.admin:
    description: Permite usar /purga start, stop y reload
    default: op
  modopurga.bypass:
    description: El plugin ignora a este jugador (no entra al evento y no se le bloquean comandos)
    default: false
